<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变：深蓝到深青 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- X 字母渐变：青色到绿色 -->
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- 光标发光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 外发光（柔和） -->
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  
  <!-- 边框微光 -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- X 字母 - 用粗笔画路径绘制，终端风格 -->
  <!-- 左上到右下的笔画 -->
  <path d="M 148 140 L 232 256 L 148 372" 
        fill="none" stroke="url(#xGrad)" stroke-width="44" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#outerGlow)"/>
  <!-- 右上到左下的笔画 -->
  <path d="M 364 140 L 280 256 L 364 372" 
        fill="none" stroke="url(#xGrad)" stroke-width="44" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#outerGlow)"/>
  
  <!-- 中间交叉点发光强调 -->
  <circle cx="256" cy="256" r="16" fill="#34d399" opacity="0.6" filter="url(#glow)"/>

  <!-- 终端光标（右下角，模拟闪烁光标） -->
  <rect x="330" y="350" width="48" height="10" rx="3" ry="3" fill="#22d3ee" filter="url(#glow)" opacity="0.9"/>
  
  <!-- 顶部小终端提示点（装饰） -->
  <circle cx="152" cy="108" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="180" cy="108" r="8" fill="#eab308" opacity="0.8"/>
  <circle cx="208" cy="108" r="8" fill="#22c55e" opacity="0.8"/>
</svg>