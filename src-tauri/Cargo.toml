[package]
name = "x-term"
version = "0.1.66"
description = "X-Term 现代化运维终端客户端"
authors = ["x-term"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "x_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
# 单实例：第二个进程启动时直接激活已有窗口退出，避免两个进程各建连接池
# 并发写同一个 xterm.db（WAL 写锁竞争 + 配置最后写入者覆盖 + 迁移竞态）。
tauri-plugin-single-instance = "2"
# 日志：attachConsole 把 webview console 转发到后端日志，排查前端问题必备。
tauri-plugin-log = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# SSH
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"

# 本地终端（Windows ConPTY / Unix PTY）
portable-pty = "0.8"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
# MySQL / PostgreSQL（SQL 控制台 + AI 工具）
# rust_decimal：DECIMAL/NUMERIC 列解码（sqlx 的 String 解码不兼容）
# uuid：PostgreSQL uuid 列解码
sqlx = { version = "0.8", default-features = false, features = ["mysql", "postgres", "uuid", "runtime-tokio-rustls", "chrono", "json", "rust_decimal"] }

# 加密
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
# 更新包完整性校验
sha2 = "0.10"
# TOTP（MFA 验证码生成）
# 注：totp-rs 实际发布到 5.x（5.7.2 为当前最新）。原 `^1.5` 在 registry 中无可匹配版本，
# 故改为 `^5.7`。使用 default-features = false 以避免引入 url/qr 等额外依赖；
# URI 解析在本项目内手写实现。
totp-rs = { version = "^5.7", default-features = false }

# HTTP（AI）
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
# HTTP 服务端（MCP Server over HTTP+SSE）
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }

# 内嵌 RDP：桥接端终止 TLS（rustls，ring provider 与现有依赖树一致，避免引入 aws-lc）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = "0.26"
# 内嵌 RDP 严格模式：从 Windows 系统证书库加载信任根校验证书链（默认不校验）。
rustls-native-certs = "0.8"
# RDCleanPath 握手 PDU 的 DER 编解码（Devolutions Gateway 协议，与官方一致）
der = { version = "0.7", features = ["derive"] }

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
dirs = "5"
once_cell = "1"
parking_lot = "0.12"
async-trait = "0.1"
base64 = "0.22"
regex = "1"
# 终端多字符编码（GBK/Big5/Shift-JIS 等）：已是 tauri-plugin-shell 的传递依赖
# （Cargo.lock 锁定 0.8.35），此处显式声明不引入新的传递依赖。
encoding_rs = "0.8"
zmodem2 = "0.7.1"

# 文件后端（S3 / 兼容存储）
# S3 SigV4 签名手写实现，复用 sha2 / reqwest；下列为签名/编码/响应解析所需。
hmac = "0.12"
hex = "0.4"
percent-encoding = "2"
quick-xml = { version = "0.36", features = ["serialize"] }
# 流式上传：bytes 提供 reqwest::Body::wrap_stream 所需的 Bytes，
# async_stream 简化异步流构造（均为 reqwest 已有传递依赖，此处显式声明）。
bytes = "1"
async-stream = "0.3"
# md-5：S3 DeleteObjects 批量删除要求的 Content-MD5 头。
md-5 = "0.10"

[dev-dependencies]
# 桥接回归测试：真实 WebSocket 升级握手（与 axum 0.7 ws 特性同版本）。
tokio-tungstenite = "0.24"

# 本地修补 russh-0.45：修复 keepalive/channel 请求的响应编码——russh 原实现
# 用"客户端视角的 channel id"回 CHANNEL_SUCCESS/FAILURE，而 Go 服务端
# （x/crypto/ssh，如 JumpServer koko）按"服务端 localId"匹配响应，匹配不到会
# 判定 "invalid channel" 协议错误并关闭整个连接（挂机 30 秒断线）。修改同步
# 自 cargo registry 缓存，vendor 目录随仓库走，避免 cargo update 后丢失。
[patch.crates-io]
russh = { path = "vendor/russh" }

[profile.release]
panic = "abort"
codegen-units = 16
opt-level = 2
strip = true
