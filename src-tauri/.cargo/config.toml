# 项目级 cargo 配置。
#
# 说明：在 Windows 上 cc crate 默认会自动探测 MSVC 工具链。如果用户环境变量
# 中设置了 CC=gcc（如 TDM-GCC/MinGW），会干扰这一探测，导致 libsqlite3-sys
# bundled 的 C 代码被编译为 GNU ABI 对象，链接到 MSVC 目标时报
# `unresolved external symbol __chkstk_ms`。
#
# 解决方案：
# - 使用 scripts\build.bat 构建（自动加载 VS 环境 + 清除旧缓存）
# - 或手动在 VS Developer Prompt / 执行 vcvars64.bat 后构建
# - 不要在系统环境变量中设置 CC=gcc（或在构建前 unset CC CXX）

[target.x86_64-pc-windows-msvc]
linker = "link.exe"
